    autostart: false
    use_sim_time: false
    result_dir: ''
    map_file: ~/catkin_ws_lite3dog/maps/robot_dog_auto_map.yaml
    initial_pose_strategy: rviz
    initial_x: 0.0
    initial_y: 0.0
    initial_yaw: 0.0
