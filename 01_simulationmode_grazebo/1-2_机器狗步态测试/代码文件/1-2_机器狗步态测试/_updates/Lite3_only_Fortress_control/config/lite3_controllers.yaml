/lite3_sim/controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    lite3_leg_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/lite3_sim/joint_state_broadcaster:
  ros__parameters:
    use_local_topics: true
    use_sim_time: true

/lite3_sim/lite3_leg_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - FL_HipX_joint
      - FL_HipY_joint
      - FL_Knee_joint
      - FR_HipX_joint
      - FR_HipY_joint
      - FR_Knee_joint
      - HL_HipX_joint
      - HL_HipY_joint
      - HL_Knee_joint
      - HR_HipX_joint
      - HR_HipY_joint
      - HR_Knee_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    state_publish_rate: 30.0
    action_monitor_rate: 20.0
